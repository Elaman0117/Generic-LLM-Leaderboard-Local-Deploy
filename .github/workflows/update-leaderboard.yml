name: LLM Leaderboard Analysis (Parameter Count)

on:
  schedule:
    # Daily at 04:00 UTC (12:00 Beijing time)
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      # V1-params: fonts are bundled in repo/fonts/ (Sarasa Mono SC subsets)
      # and registered by src/analyze.py via matplotlib addfont().

      - name: Scrape leaderboard data
        run: python src/scrape.py

      # Incremental: output/param_cache.json is committed, so only new slugs
      # are fetched. --limit caps CI time; the next run catches up.
      - name: Scrape model parameter counts (incremental)
        run: python src/scrape_params.py --sleep 0.3 --limit 150

      - name: Run analysis
        run: python src/analyze.py

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/ README.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update params leaderboard analysis $(date +"%Y-%m-%d")"
            git push
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: analysis-results
          path: output/
          retention-days: 90
